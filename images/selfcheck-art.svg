<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMaxYMid slice">
  <!-- Illustration: a night street where one shop is hidden in the dark. The self-check on a phone
       shines a light on it: the shutter lifts, the sign lights up and a pin marks it on the map.
       Brand colours only, no people. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1A33"/><stop offset="1" stop-color="#16294F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB27F"/><stop offset="1" stop-color="#FF6B1A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#F6F3EC">
    <circle cx="790" cy="54" r="2" fill-opacity=".5"/><circle cx="1110" cy="40" r="2.5" fill-opacity=".45"/>
    <circle cx="1010" cy="96" r="1.6" fill-opacity=".35"/><circle cx="1180" cy="150" r="1.8" fill-opacity=".4"/>
    <circle cx="880" cy="30" r="1.5" fill-opacity=".3"/>
  </g>

  <!-- ground -->
  <rect y="440" width="1200" height="60" fill="#0E1F3E"/>
  <path d="M560 470h40M640 470h40M720 470h40M800 470h40M880 470h40M960 470h40M1040 470h40M1120 470h40" stroke="#F6F3EC" stroke-opacity=".12" stroke-width="4" stroke-linecap="round"/>

  <!-- shop 1: lit -->
  <g>
    <rect x="566" y="276" width="124" height="164" fill="#1D3664"/>
    <rect x="580" y="292" width="96" height="22" rx="4" fill="#F6F3EC" fill-opacity=".85"/>
    <path d="M566 322h124v18H566z" fill="#F6F3EC" fill-opacity=".18"/>
    <path d="M566 340l10 12 10-12 10 12 10-12 10 12 10-12 10 12 10-12 10 12 10-12 10 12 10-12 4 5" fill="none" stroke="#F6F3EC" stroke-opacity=".3" stroke-width="2"/>
    <rect x="580" y="362" width="44" height="78" fill="#F6F3EC" fill-opacity=".16"/>
    <rect x="634" y="362" width="42" height="40" rx="3" fill="#F6F3EC" fill-opacity=".22"/>
  </g>

  <!-- shop 2: taller, lit windows -->
  <g>
    <rect x="700" y="214" width="136" height="226" fill="#223D6E"/>
    <g fill="#F6F3EC">
      <rect x="716" y="232" width="28" height="22" rx="3" fill-opacity=".28"/><rect x="754" y="232" width="28" height="22" rx="3" fill-opacity=".12"/><rect x="792" y="232" width="28" height="22" rx="3" fill-opacity=".28"/>
      <rect x="716" y="268" width="28" height="22" rx="3" fill-opacity=".12"/><rect x="754" y="268" width="28" height="22" rx="3" fill-opacity=".28"/><rect x="792" y="268" width="28" height="22" rx="3" fill-opacity=".28"/>
    </g>
    <rect x="714" y="308" width="108" height="24" rx="4" fill="#F6F3EC" fill-opacity=".8"/>
    <rect x="714" y="346" width="108" height="94" fill="#F6F3EC" fill-opacity=".14"/>
    <path d="M768 346v94" stroke="#223D6E" stroke-width="4"/>
  </g>

  <!-- shops 4 and 5: lit -->
  <g>
    <rect x="1030" y="262" width="112" height="178" fill="#1D3664"/>
    <rect x="1044" y="278" width="84" height="22" rx="4" fill="#F6F3EC" fill-opacity=".85"/>
    <rect x="1044" y="318" width="84" height="56" rx="3" fill="#F6F3EC" fill-opacity=".2"/>
    <rect x="1044" y="384" width="36" height="56" fill="#F6F3EC" fill-opacity=".14"/>
    <rect x="1150" y="226" width="60" height="214" fill="#223D6E"/>
    <rect x="1162" y="244" width="26" height="22" rx="3" fill="#F6F3EC" fill-opacity=".25"/>
    <rect x="1162" y="280" width="26" height="22" rx="3" fill="#F6F3EC" fill-opacity=".12"/>
  </g>

  <!-- shop 3: the hidden business, dark until the light finds it -->
  <rect x="848" y="244" width="170" height="196" fill="#101F3D"/>

  <!-- light from the self-check -->
  <polygon points="722,96 1040,236 1030,452 846,452" fill="url(#beam)"/>
  <ellipse cx="934" cy="440" rx="120" ry="16" fill="#FF6B1A" fill-opacity=".22"/>

  <!-- shop 3 revealed: sign lit, shutter half up, warm inside -->
  <g>
    <circle cx="934" cy="290" r="96" fill="url(#glow)"/>
    <rect x="866" y="276" width="136" height="30" rx="5" fill="#FF6B1A"/>
    <rect x="890" y="287" width="88" height="8" rx="4" fill="#0B1A33" fill-opacity=".55"/>
    <rect x="866" y="324" width="136" height="116" fill="url(#inside)"/>
    <g fill="#0B1A33" fill-opacity=".32">
      <rect x="880" y="392" width="24" height="30" rx="3"/><rect x="910" y="380" width="30" height="42" rx="3"/>
      <rect x="946" y="398" width="22" height="24" rx="3"/><rect x="974" y="386" width="16" height="36" rx="3"/>
      <rect x="876" y="422" width="118" height="6" rx="3"/>
    </g>
    <rect x="862" y="318" width="144" height="54" rx="4" fill="#33507F"/>
    <path d="M866 330h136M866 342h136M866 354h136M866 366h136" stroke="#0B1A33" stroke-opacity=".35" stroke-width="2"/>
    <rect x="926" y="364" width="16" height="6" rx="3" fill="#0B1A33" fill-opacity=".45"/>
  </g>

  <!-- map pin dropping onto it -->
  <g transform="translate(934 150)">
    <ellipse cx="0" cy="112" rx="16" ry="4" fill="#0B1A33" fill-opacity=".35"/>
    <path d="M0 96C-6 74-34 58-34 28a34 34 0 0 1 68 0C34 58 6 74 0 96z" fill="#FF6B1A" stroke="#0B1A33" stroke-width="3"/>
    <circle cx="0" cy="28" r="17" fill="#F6F3EC"/>
    <path d="M-8 28l6 6 11-12" fill="none" stroke="#0B1A33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g stroke="#FF6B1A" stroke-width="4" stroke-linecap="round" stroke-opacity=".8">
    <path d="M884 150l-12-8M984 150l12-8M934 120v-14"/>
  </g>

  <!-- the self-check on a phone: question 4 of 7, an answer picked -->
  <g transform="translate(596 64) rotate(-10)">
    <rect width="128" height="226" rx="20" fill="#F6F3EC"/>
    <rect x="8" y="10" width="112" height="206" rx="14" fill="#0B1A33"/>
    <rect x="50" y="18" width="28" height="5" rx="2.5" fill="#F6F3EC" fill-opacity=".25"/>
    <rect x="20" y="36" width="88" height="6" rx="3" fill="#F6F3EC" fill-opacity=".15"/>
    <rect x="20" y="36" width="50" height="6" rx="3" fill="#FF6B1A"/>
    <rect x="20" y="56" width="84" height="9" rx="4.5" fill="#F6F3EC" fill-opacity=".9"/>
    <rect x="20" y="70" width="58" height="9" rx="4.5" fill="#F6F3EC" fill-opacity=".9"/>
    <g fill="none" stroke="#F6F3EC" stroke-opacity=".3" stroke-width="2">
      <rect x="20" y="94" width="88" height="20" rx="10"/><rect x="20" y="120" width="88" height="20" rx="10"/><rect x="20" y="172" width="88" height="20" rx="10"/>
    </g>
    <rect x="20" y="146" width="88" height="20" rx="10" fill="#FF6B1A"/>
    <circle cx="32" cy="156" r="5" fill="#0B1A33"/>
    <g fill="#F6F3EC" fill-opacity=".45">
      <rect x="32" y="101" width="50" height="6" rx="3"/><rect x="32" y="127" width="40" height="6" rx="3"/><rect x="32" y="179" width="56" height="6" rx="3"/>
    </g>
    <rect x="44" y="153" width="46" height="6" rx="3" fill="#0B1A33" fill-opacity=".7"/>
  </g>
</svg>
