<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMaxYMid slice">
  <!-- Illustration: a stylised preview of the visibility self-check result. Brand colours only. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A33"/><stop offset="1" stop-color="#13264A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- soft rings radiating from the chart -->
  <g fill="none" stroke="#F6F3EC" stroke-opacity=".08" stroke-width="1.5">
    <circle cx="905" cy="250" r="300"/><circle cx="905" cy="250" r="370"/><circle cx="905" cy="250" r="440"/>
  </g>

  <!-- orange spotlight -->
  <circle cx="905" cy="250" r="236" fill="#FF6B1A"/>

  <!-- radar grid -->
  <g fill="none" stroke="#0B1A33" stroke-opacity=".28" stroke-width="1.5">
    <polygon points="905.0,72.0 1044.2,139.0 1078.5,289.6 982.2,410.4 827.8,410.4 731.5,289.6 765.8,139.0"/><polygon points="905.0,132.5 996.8,176.8 1019.5,276.1 956.0,355.8 854.0,355.8 790.5,276.1 813.2,176.8"/><polygon points="905.0,191.3 950.9,213.4 962.3,263.1 930.5,302.9 879.5,302.9 847.7,263.1 859.1,213.4"/>
    <line x1="905" y1="250" x2="905.0" y2="72.0"/><line x1="905" y1="250" x2="1044.2" y2="139.0"/><line x1="905" y1="250" x2="1078.5" y2="289.6"/><line x1="905" y1="250" x2="982.2" y2="410.4"/><line x1="905" y1="250" x2="827.8" y2="410.4"/><line x1="905" y1="250" x2="731.5" y2="289.6"/><line x1="905" y1="250" x2="765.8" y2="139.0"/>
  </g>
  <!-- the result shape -->
  <polygon points="905.0,96.9 971.8,196.7 1029.9,278.5 951.3,346.2 878.7,304.5 766.2,281.7 832.6,192.3" fill="#0B1A33" fill-opacity=".9" stroke="#0B1A33" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#F6F3EC" stroke="#0B1A33" stroke-width="3"><circle cx="905.0" cy="96.9" r="6"/><circle cx="971.8" cy="196.7" r="6"/><circle cx="1029.9" cy="278.5" r="6"/><circle cx="951.3" cy="346.2" r="6"/><circle cx="878.7" cy="304.5" r="6"/><circle cx="766.2" cy="281.7" r="6"/><circle cx="832.6" cy="192.3" r="6"/></g>

  <!-- floating result card: score -->
  <g transform="translate(596 70) rotate(-5)">
    <rect width="190" height="104" rx="18" fill="#F6F3EC"/>
    <rect x="20" y="22" width="64" height="10" rx="5" fill="#0B1A33" fill-opacity=".35"/>
    <rect x="20" y="46" width="96" height="22" rx="6" fill="#0B1A33"/>
    <rect x="20" y="80" width="150" height="8" rx="4" fill="#0B1A33" fill-opacity=".12"/>
    <rect x="20" y="80" width="92" height="8" rx="4" fill="#FF6B1A"/>
    <circle cx="156" cy="40" r="16" fill="#FF6B1A"/>
    <path d="M149 40l5 5 9-10" fill="none" stroke="#0B1A33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating result card: what would fix it -->
  <g transform="translate(1004 356) rotate(6)">
    <rect width="176" height="98" rx="18" fill="#F6F3EC"/>
    <circle cx="34" cy="34" r="12" fill="#FF6B1A"/>
    <rect x="56" y="28" width="96" height="12" rx="6" fill="#0B1A33"/>
    <circle cx="34" cy="66" r="12" fill="#0B1A33" fill-opacity=".18"/>
    <rect x="56" y="60" width="72" height="12" rx="6" fill="#0B1A33" fill-opacity=".35"/>
  </g>

  <!-- magnifying glass -->
  <g transform="translate(628 318)" fill="none" stroke="#F6F3EC" stroke-linecap="round">
    <circle cx="46" cy="46" r="40" stroke-width="7"/>
    <path d="M76 76l40 40" stroke-width="14"/>
    <path d="M24 40a24 24 0 0 1 20-18" stroke-width="5" stroke-opacity=".55"/>
  </g>

  <!-- small accents -->
  <g fill="#F6F3EC">
    <circle cx="1150" cy="150" r="5" fill-opacity=".5"/>
    <circle cx="820" cy="474" r="4" fill-opacity=".35"/>
  </g>
  <g stroke="#FF6B1A" stroke-width="4" stroke-linecap="round">
    <path d="M1168 300v16M1160 308h16"/>
  </g>
</svg>
